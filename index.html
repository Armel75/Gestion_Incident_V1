<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/template/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>IncidentManager Enterprise</title>
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Default light mode */
      body { background-color: #f8fafc; color: #0f172a; }
      
      /* Dark mode overrides */
      html.dark body { background-color: #020617; color: #f8fafc; }
      
      /* Subtle Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; border: 2px solid #f8fafc; }
      ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
      
      /* Dark scrollbar */
      html.dark ::-webkit-scrollbar-thumb { background: #334155; border-color: #020617; }
      html.dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* Reset focus outlines for mouse users, keep for keyboard */
      :focus:not(:focus-visible) { outline: none; box-shadow: none; }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
